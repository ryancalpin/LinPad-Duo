name: LinPad Duo IPA

# Builds LinPad Duo on GitHub's Apple-silicon Macs (free for public repositories), so no
# Mac of your own has to run Xcode (DUO-SETUP.md, "Building in the cloud").
#
# With the repository secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID (a paid
# Apple Developer account), the IPA is signed for your registered devices, published as the
# release "duo-latest", and installed from https://ryancalpin.github.io/LinPad-Duo/ in
# Safari on the phone. Without them it is ad-hoc signed, for Sideloadly and friends.
on:
  push:
    branches: [duo]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duo-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

jobs:
  ipa:
    name: Build the IPA
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build tools
        run: |
          brew install meson ninja llvm lld libarchive coreutils pkgconf
          python3 -m pip install --user --break-system-packages mako || python3 -m pip install --user mako
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # virglrenderer and MoltenVK for the GPU bridge, built once per change to their pins.
      - name: Cache the GPU libraries
        uses: actions/cache@v4
        with:
          path: gpu/prefix-ios
          key: gpu-prefix-ios-${{ hashFiles('gpu/build-third-party.sh', 'gpu/patches/**', 'gpu/cross/**') }}

      - name: Cache the Linux system download
        uses: actions/cache@v4
        with:
          path: build-duo/linpad-rootfs.tar.gz
          key: linpad-rootfs-1.5.0

      - name: Build the IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IPA_URL: https://github.com/${{ github.repository }}/releases/download/duo-latest/LinPad-Duo.ipa
        run: |
          set -o pipefail
          release/duo-build-ipa.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Errors from the build
        if: failure()
        run: grep -E "error:|\*\* BUILD FAILED|fatal" "$RUNNER_TEMP/build.log" | head -150 || true

      - uses: actions/upload-artifact@v4
        with:
          name: LinPad-Duo-ipa
          path: build-duo/LinPad-Duo.ipa
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 7

      - name: Was it signed?
        id: signed
        run: |
          if [ -f build-duo/site/manifest.plist ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.signed.outputs.signed == 'true'
        with:
          path: build-duo/site

    outputs:
      signed: ${{ steps.signed.outputs.signed }}

  # The signed IPA replaces the release "duo-latest"; the install page points at it.
  publish:
    name: Publish the signed IPA
    needs: ipa
    if: needs.ipa.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LinPad-Duo-ipa

      - name: Replace the duo-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete duo-latest --yes --cleanup-tag || true
          gh release create duo-latest LinPad-Duo.ipa --prerelease --target "$GITHUB_SHA" \
            --title "LinPad Duo (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On the iPhone, open https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/ in Safari and tap Install."

      - id: pages
        uses: actions/deploy-pages@v4
